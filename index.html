<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7e4e8">
<title>A Letter For You 💌</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:Georgia,"Times New Roman",serif;
  color:#633544;
  background:radial-gradient(circle at 50% 40%,#fff 0,#fff8fa 48%,#f3dce2 100%);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow{position:absolute;width:260px;height:260px;border-radius:50%;
  background:rgba(239,132,159,.10)}
.glow.a{left:-120px;top:-100px}.glow.b{right:-130px;bottom:-120px}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;
  box-shadow:0 0 7px rgba(255,255,255,.95);opacity:0;
  animation:float 8s ease-in-out infinite}
.s1{left:10%;top:78%;animation-delay:0s}.s2{left:25%;top:22%;animation-delay:2s}
.s3{left:52%;top:80%;animation-delay:4s}.s4{left:74%;top:25%;animation-delay:1s}
.s5{left:90%;top:65%;animation-delay:5s}.s6{left:42%;top:12%;animation-delay:6s}
@keyframes float{
  0%,100%{opacity:0;transform:translateY(25px) scale(.3)}
  35%{opacity:.8} 55%{opacity:1;transform:translateY(-45px) scale(1)}
}
.twinkle{position:absolute;width:7px;height:7px;opacity:0;animation:tw 2s infinite}
.twinkle:before,.twinkle:after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:4px}
.twinkle:before{width:2px;height:25px;transform:translate(-50%,-50%)}
.twinkle:after{width:25px;height:2px;transform:translate(-50%,-50%)}
.t1{left:22%;top:28%}.t2{left:78%;top:58%;animation-delay:.7s}
.t3{left:88%;top:20%;animation-delay:1.4s}
@keyframes tw{0%,55%,100%{opacity:0;transform:scale(.2) rotate(0)}
65%{opacity:.7;transform:scale(.8) rotate(20deg)}
72%{opacity:1;transform:scale(1.15) rotate(45deg)}
82%{opacity:0;transform:scale(.2) rotate(80deg)}}

.screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;z-index:5;
  transition:opacity .25s ease,visibility .25s ease;
}
.screen.active{opacity:1;visibility:visible;pointer-events:auto}

/* ENVELOPE */
.envelope-stage{
  position:relative;width:min(500px,88vw);height:min(333px,58vw);
  min-height:210px;display:block;visibility:visible;opacity:1;
}
.envelope{
  position:absolute;inset:0;display:block;visibility:visible;opacity:1;
  overflow:hidden;border-radius:22px;touch-action:manipulation;
  background:linear-gradient(145deg,#f9b9c9,#e98da6 55%,#d86c88);
  box-shadow:0 18px 38px rgba(101,39,59,.18);
}
.envelope:before{
  content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.3);
  border-radius:16px;pointer-events:none;z-index:30
}
.front{position:absolute;inset:0;z-index:5;pointer-events:none}
.front:before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(34deg,transparent 49.6%,rgba(255,255,255,.24) 50%,transparent 50.4%),
    linear-gradient(-34deg,transparent 49.6%,rgba(255,255,255,.24) 50%,transparent 50.4%);
}
.bottom-flap{
  position:absolute;left:0;right:0;bottom:0;height:61%;z-index:8;
  clip-path:polygon(0 0,50% 76%,100% 0,100% 100%,0 100%);
  background:linear-gradient(145deg,#ee94a9,#d96c88)
}
.top-flap{
  position:absolute;left:0;top:0;width:100%;height:70%;z-index:20;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(145deg,#ffd1db,#f2a0b3 50%,#dd718c);
  transform-origin:top center;
  transition:transform .55s ease;
}
.envelope.open .top-flap{transform:rotateX(-170deg)}
.heart{
  position:absolute;left:50%;top:50%;width:16px;height:16px;z-index:50;
  transform:translate(-50%,-50%) rotate(-45deg);
  background:#d43a61;border-radius:3px 0 3px 0;
  box-shadow:0 3px 7px rgba(95,25,45,.22);
}
.heart:before,.heart:after{content:"";position:absolute;width:16px;height:16px;
  border-radius:50%;background:#d43a61}
.heart:before{top:-8px;left:0}.heart:after{top:0;left:8px}
.envelope.open .heart{opacity:0;transform:translate(-50%,-50%) rotate(-45deg) scale(.3)}
.open-hint{position:fixed;bottom:38px;color:#c94d70;font-size:15px;pointer-events:none}
.open-hint.hide{opacity:0}

/* PAPER */
.paper,.reading-paper{
  position:relative;width:min(820px,94vw);height:min(88vh,760px);
  padding:52px 68px 78px;background:#fffaf7;border:1px solid rgba(190,100,125,.2);
  border-radius:12px;box-shadow:0 18px 45px rgba(80,35,50,.16);
}
.greeting{
  display:block;width:100%;border:0;outline:0;background:transparent;text-align:center;
  font:italic 43px Georgia;color:#bd4d6d
}
.greeting::placeholder{color:rgba(189,77,109,.32)}
.divider{text-align:center;color:#d27189;margin:10px 0 20px}
.write-note{text-align:center;font-size:13px;color:#a46b7a;font-style:italic;margin-bottom:10px}
#message{
  width:100%;height:calc(100% - 185px);resize:none;border:0;outline:0;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(184,111,130,.12) 32px);
  font:19px/32px Georgia;color:#553641;padding:5px 8px
}
#message::placeholder{color:rgba(170,112,126,.48);font-style:italic}
.signature-box{
  position:absolute;right:65px;bottom:65px;width:280px;text-align:right;z-index:10;
  touch-action:manipulation
}
.from-text{display:block;width:100%;text-align:right;border:0;outline:0;background:transparent;color:#a94361;font:italic 18px Georgia}
.from-text::placeholder{color:rgba(169,67,97,.4);font-style:italic}
.signature-placeholder{display:block;color:rgba(169,67,97,.3);font:italic 16px Georgia;margin-top:4px}
#signatureImage{display:none;max-width:230px;max-height:70px;margin:5px 0 0 auto}
.seal-button{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
  border:0;border-radius:999px;padding:8px 22px;color:#fff;
  background:linear-gradient(135deg,#e8849e,#c94e70);
  box-shadow:0 7px 16px rgba(180,65,95,.2)
}
.close{
  position:absolute;right:18px;top:15px;width:40px;height:40px;border:0;border-radius:50%;
  background:rgba(200,75,110,.1);color:#c94d70;font-size:23px;z-index:100
}

/* SIGNATURE */
.signature-screen{flex-direction:column}
.signature-title{font:italic 27px Georgia;color:#c4496c;margin-bottom:7px}
.signature-sub{font-size:13px;color:#a66a79;margin-bottom:16px}
#signatureCanvas{
  width:min(850px,92vw);height:min(400px,52vh);display:block;background:#fff;
  border:1px solid rgba(190,90,115,.2);border-radius:12px;touch-action:none
}
.signature-actions{display:flex;gap:10px;margin-top:16px}
.signature-action{border:0;border-radius:999px;padding:10px 23px}
.clear-signature{background:rgba(190,75,105,.1);color:#b33f60}
.done-signature{background:#c94e70;color:#fff}

/* SHARE/LOCK */
.share-screen,.lock-screen{flex-direction:column}
.share-envelope{
  position:relative;width:min(360px,80vw);height:min(240px,53vw);min-height:180px;
  border-radius:20px;background:linear-gradient(145deg,#f8b5c6,#ed7e9b,#d45a7a);
  box-shadow:0 18px 40px rgba(90,35,55,.18);overflow:hidden
}
.share-flap{position:absolute;inset:0 0 auto;height:70%;clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(145deg,#ffd0da,#f18ca5,#d65e7d)}
.share-heart{position:absolute;left:50%;top:50%;width:15px;height:15px;z-index:5;
  transform:translate(-50%,-50%) rotate(-45deg);background:#d93d65;border-radius:3px 0 3px 0}
.share-heart:before,.share-heart:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#d93d65}
.share-heart:before{top:-7.5px}.share-heart:after{left:7.5px}
.share-title{font:italic 24px Georgia;color:#c4496c;margin-top:28px}
.share-sub{font-size:13px;color:#a66a79;margin:7px 0;text-align:center;padding:0 20px}
#passwordInput,#unlockPassword{width:250px;padding:10px 15px;border-radius:999px;border:1px solid rgba(190,80,110,.2);outline:0;background:#fff;text-align:center}
.actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;justify-content:center;padding:0 10px}
.action,.unlock-button{border:0;border-radius:999px;padding:10px 18px;color:#fff;background:#c94e70}
#linkBox{display:none;margin-top:10px}
#linkInput{width:min(600px,84vw);padding:9px;border:0;border-radius:8px;outline:0}
.lock-title{font:italic 27px Georgia;color:#c4496c;margin-top:25px}
.lock-sub{font-size:13px;color:#a66a79;margin:7px 0 14px}
.unlock-button{margin-top:11px}

/* READING */
.reading-paper{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:58px 68px}
.reading-paper::-webkit-scrollbar{width:5px}
.reading-paper::-webkit-scrollbar-thumb{background:rgba(190,80,110,.2);border-radius:20px}
.read-greeting{text-align:center;font:italic 43px Georgia;color:#bd4d6d}
.read-divider{text-align:center;color:#d27189;margin:13px 0 28px}
#readMessage{white-space:pre-wrap;font:19px/1.9 Georgia;color:#553641}
#readSignature{margin-top:34px;text-align:right}
#readSignatureImage{max-width:230px;max-height:80px;display:block;margin:5px 0 0 auto}

@media(max-width:600px){
  .glow{display:none}
  .twinkle{display:none}
  .envelope-stage{width:88vw;height:58.7vw;min-height:200px}
  .paper{width:94vw;height:88vh;padding:45px 25px 76px}
  .greeting,.read-greeting{font-size:33px}
  #message{font-size:17px;line-height:29px}
  .signature-box{right:25px;bottom:62px;width:235px}
  .reading-paper{width:94vw;height:88vh;padding:50px 28px}
  #readMessage{font-size:17px;line-height:1.85}
}

/* Receiver reading view is strictly read-only */
#readingScreen input,
#readingScreen textarea,
#readingScreen [contenteditable="true"]{
  pointer-events:none;
  user-select:text;
}


/* =========================================================
   AESTHETIC READ-ONLY LETTER
   Keeps the receiver view non-editable but makes it feel
   like the same handcrafted letter as the writing view.
========================================================= */
#readingScreen{
  padding:18px;
}
#readingScreen .reading-paper{
  position:relative;
  width:min(820px,94vw);
  height:min(88vh,760px);
  padding:62px 72px 78px;
  overflow:auto;
  border:1px solid rgba(173,83,108,.24);
  border-radius:18px;
  background:
    linear-gradient(rgba(255,252,249,.97),rgba(255,249,246,.97)),
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 31px,
      rgba(181,105,125,.055) 32px
    );
  box-shadow:
    0 24px 55px rgba(83,39,53,.18),
    0 4px 12px rgba(83,39,53,.08);
}

/* Fine inner frame */
#readingScreen .reading-paper::before{
  content:"";
  position:absolute;
  inset:13px;
  border:1px solid rgba(190,88,116,.18);
  border-radius:12px;
  pointer-events:none;
}

/* Tiny corner ornaments */
#readingScreen .reading-paper::after{
  content:"✦";
  position:absolute;
  top:19px;
  right:25px;
  color:rgba(195,72,104,.42);
  font-size:14px;
  pointer-events:none;
}

#readingScreen .read-greeting{
  position:relative;
  z-index:1;
  margin-top:3px;
  color:#b94668;
  font-size:43px;
  letter-spacing:.2px;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
}

#readingScreen .read-divider{
  position:relative;
  z-index:1;
  margin:14px 0 30px;
  color:#cc6580;
  font-size:15px;
}
#readingScreen .read-divider::before,
#readingScreen .read-divider::after{
  content:"";
  display:inline-block;
  width:72px;
  height:1px;
  vertical-align:middle;
  margin:0 12px;
  background:linear-gradient(to right,transparent,rgba(190,80,110,.28));
}
#readingScreen .read-divider::after{
  background:linear-gradient(to left,transparent,rgba(190,80,110,.28));
}

#readingScreen #readMessage{
  position:relative;
  z-index:1;
  max-width:690px;
  margin:0 auto;
  padding:5px 8px;
  color:#563740;
  font-size:19px;
  line-height:2;
  white-space:pre-wrap;
  text-align:left;
}

#readingScreen #readSignature{
  position:relative;
  z-index:1;
  max-width:690px;
  margin:38px auto 0;
  padding-top:18px;
  text-align:right;
  border-top:1px solid rgba(183,91,115,.13);
}

#readingScreen #readFrom{
  display:block;
  color:#a94361;
  font:italic 18px Georgia,"Times New Roman",serif;
}

#readingScreen #readSignatureImage{
  display:block;
  max-width:230px;
  max-height:80px;
  margin:7px 0 0 auto;
  object-fit:contain;
}

@media(max-width:600px){
  #readingScreen{
    padding:12px;
  }
  #readingScreen .reading-paper{
    width:94vw;
    height:88vh;
    padding:52px 28px 62px;
    border-radius:16px;
  }
  #readingScreen .reading-paper::before{
    inset:9px;
    border-radius:10px;
  }
  #readingScreen .read-greeting{
    font-size:34px;
  }
  #readingScreen .read-divider{
    margin:12px 0 24px;
  }
  #readingScreen .read-divider::before,
  #readingScreen .read-divider::after{
    width:35px;
    margin:0 7px;
  }
  #readingScreen #readMessage{
    font-size:17px;
    line-height:1.9;
    padding:3px 2px;
  }
  #readingScreen #readSignature{
    margin-top:30px;
  }
}

</style>
</head>

<body>
<div class="bg">
  <i class="glow a"></i><i class="glow b"></i>
  <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>
  <i class="spark s4"></i><i class="spark s5"></i><i class="spark s6"></i>
  <i class="twinkle t1"></i><i class="twinkle t2"></i><i class="twinkle t3"></i>
</div>

<section class="screen active" id="homeScreen">
  <div class="envelope-stage">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open envelope">
      <div class="front"></div>
      <div class="bottom-flap"></div>
      <div class="top-flap"></div>
      <div class="heart"></div>
    </div>
  </div>
  <div class="open-hint" id="openHint">Click the envelope to open your letter</div>
</section>

<section class="screen" id="writeScreen">
  <button class="close" id="closeWrite">×</button>
  <div class="paper">
    <input class="greeting" id="greeting" placeholder="Dear You," maxlength="100">
    <div class="divider">♥</div>
    <div class="write-note">Take your time... write whatever is in your heart.</div>
    <textarea id="message" placeholder="Write your letter here..."></textarea>

    <div class="signature-box" id="signatureBox">
      <input class="from-text" id="fromText" type="text" placeholder="From your friend..." autocomplete="off" spellcheck="false" maxlength="60">
      <span class="signature-placeholder" id="signaturePlaceholder">Your signature</span>
      <img id="signatureImage" alt="Your signature">
    </div>

    <button class="seal-button" id="sealButton">Seal Letter 💌</button>
  </div>
</section>

<section class="screen signature-screen" id="signatureScreen">
  <button class="close" id="closeSignature">×</button>
  <div class="signature-title">Your Signature ✍️</div>
  <div class="signature-sub">Draw your signature with your finger.</div>
  <canvas id="signatureCanvas"></canvas>
  <div class="signature-actions">
    <button class="signature-action clear-signature" id="clearSignature">Clear</button>
    <button class="signature-action done-signature" id="doneSignature">Done ✓</button>
  </div>
</section>

<section class="screen share-screen" id="shareScreen">
  <div class="share-envelope"><div class="share-flap"></div><div class="share-heart"></div></div>
  <div class="share-title">Your letter is sealed ♥</div>
  <div class="share-sub">Add a password if you want to keep it private.</div>
  <input id="passwordInput" type="password" placeholder="Set password (optional)" autocomplete="new-password">
  <div class="actions">
    <button class="action" id="generateButton">Generate Link 🔗</button>
    <button class="action" id="copyButton">Copy</button>
    <button class="action" id="shareButton">Share ↗</button>
  </div>
  <div id="linkBox"><input id="linkInput" readonly></div>
</section>

<section class="screen lock-screen" id="lockScreen">
  <div class="share-envelope"><div class="share-flap"></div><div class="share-heart"></div></div>
  <div class="lock-title">This letter is private 🔐</div>
  <div class="lock-sub">Enter the password to open it.</div>
  <input id="unlockPassword" type="password" placeholder="Password" autocomplete="off">
  <button class="unlock-button" id="unlockButton">Unlock Letter 💌</button>
</section>

<section class="screen" id="readingScreen">
  <button class="close" id="closeReading">×</button>
  <article class="reading-paper">
    <h1 class="read-greeting" id="readGreeting"></h1>
    <div class="read-divider">♥</div>
    <div id="readMessage"></div>
    <div id="readSignature">
      <span id="readFrom"></span>
      <img id="readSignatureImage" alt="Signature">
    </div>
  </article>
</section>

<script>
"use strict";

const $ = id => document.getElementById(id);

const screens = {
  home:$("homeScreen"),
  write:$("writeScreen"),
  signature:$("signatureScreen"),
  share:$("shareScreen"),
  lock:$("lockScreen"),
  reading:$("readingScreen")
};

function showScreen(screen){
  Object.values(screens).forEach(s=>s.classList.remove("active"));
  screen.classList.add("active");
}

/* Envelope: intentionally simple for Android Chrome */
let opened=false;
function openEnvelope(e){
  if(e) e.preventDefault();
  if(opened) return;
  opened=true;
  $("openHint").classList.add("hide");
  $("envelope").classList.add("open");

  // Shared links are READ-ONLY:
  // receiver sees the envelope first, opens it, then gets the letter.
  if(shared){
    setTimeout(()=>{
      if(shared.password){
        showScreen(screens.lock);
      }else{
        openReading(shared);
      }
    },650);
    return;
  }

  // Normal/new letter flow remains editable.
  setTimeout(()=>showScreen(screens.write),650);
}
$("envelope").addEventListener("click",openEnvelope);
$("envelope").addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();openEnvelope(e);}
});

function resetHome(){
  showScreen(screens.home);
  $("envelope").classList.remove("open");
  $("openHint").classList.remove("hide");
  opened=false;
}
$("closeWrite").onclick=resetHome;
$("closeReading").onclick=resetHome;

/* Signature */
const canvas=$("signatureCanvas");
const ctx=canvas.getContext("2d");
let drawing=false,hasSignature=false;

function sizeCanvas(){
  const r=canvas.getBoundingClientRect();
  const d=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.round(r.width*d));
  canvas.height=Math.max(1,Math.round(r.height*d));
  ctx.setTransform(d,0,0,d,0,0);
  ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";
}
function pos(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);
  const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);
},{passive:false});
canvas.addEventListener("pointermove",e=>{
  if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();hasSignature=true;
},{passive:false});
function stop(e){if(!drawing)return;drawing=false;try{canvas.releasePointerCapture(e.pointerId)}catch(_){}}
canvas.addEventListener("pointerup",stop);
canvas.addEventListener("pointercancel",stop);

$("signatureBox").addEventListener("click",e=>{
  if(e.target.closest("#fromText"))return;
  showScreen(screens.signature);
  setTimeout(sizeCanvas,60);
});
/* Re-fit the canvas if the phone is rotated while the pad is open (Android/iOS) */
window.addEventListener("resize",()=>{
  if(screens.signature.classList.contains("active")) sizeCanvas();
},{passive:true});
$("clearSignature").onclick=()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);hasSignature=false;
};
$("doneSignature").onclick=()=>{
  if(!hasSignature)return;
  const img=canvas.toDataURL("image/png");
  sessionStorage.setItem("letterSignature",img);
  $("signatureImage").src=img;
  $("signatureImage").style.display="block";
  $("signaturePlaceholder").style.display="none";
  showScreen(screens.write);
};
$("closeSignature").onclick=()=>showScreen(screens.write);

$("fromText").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();$("fromText").blur();}
});

/* Data + sharing */
function getData(){
  return {
    greeting:$("greeting").value.trim()||"Dear You,",
    message:$("message").value.trim(),
    from:$("fromText").value.trim()||"From your friend...",
    signature:sessionStorage.getItem("letterSignature")||""
  };
}
function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function dec(s){return decodeURIComponent(escape(atob(s)))}

async function hashPassword(s){
  try{
    if(window.crypto && crypto.subtle && window.isSecureContext){
      const b=new TextEncoder().encode(s);
      const h=await crypto.subtle.digest("SHA-256",b);
      return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(_){/* fall through to plain fallback below */}
  // Fallback for non-secure contexts (e.g. opened as a local file on Android)
  // where crypto.subtle is unavailable. Not cryptographically strong, but
  // keeps the feature working instead of throwing and breaking the page.
  let h=0;
  for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}
  return "f"+h.toString(16);
}

function openReading(data){
  $("readGreeting").textContent=data.greeting||"Dear You,";
  $("readMessage").textContent=data.message||"";
  $("readFrom").textContent=data.from||"";
  if(data.signature){
    $("readSignatureImage").src=data.signature;
    $("readSignatureImage").style.display="block";
  }else{
    $("readSignatureImage").style.display="none";
  }
  showScreen(screens.reading);
}

/* Seal -> go to share/password screen */
$("sealButton").onclick=()=>{
  if(!$("message").value.trim()) return;
  showScreen(screens.share);
};

/* Build the shareable link */
$("generateButton").onclick=async ()=>{
  const data=getData();
  const password=$("passwordInput").value.trim();
  if(password){
    data.passwordHash=await hashPassword(password);
    delete data.password;
  }
  const encoded=enc(JSON.stringify(data));
  const url=location.origin+location.pathname+"?d="+encoded;
  $("linkInput").value=url;
  $("linkBox").style.display="block";
};

$("copyButton").onclick=async ()=>{
  if(!$("linkInput").value){$("generateButton").click();await new Promise(r=>setTimeout(r,0));}
  if(!$("linkInput").value) return;
  try{
    await navigator.clipboard.writeText($("linkInput").value);
  }catch(_){
    $("linkInput").removeAttribute("readonly");
    $("linkInput").select();
    try{document.execCommand("copy");}catch(__){}
    $("linkInput").setAttribute("readonly","readonly");
  }
};

$("shareButton").onclick=async ()=>{
  if(!$("linkInput").value){$("generateButton").click();await new Promise(r=>setTimeout(r,0));}
  const url=$("linkInput").value;
  if(!url) return;
  if(navigator.share){
    try{await navigator.share({title:"A Letter For You 💌",url});}catch(_){/* user cancelled */}
  }else{
    $("copyButton").click();
  }
};

$("unlockButton").onclick=async ()=>{
  const entered=$("unlockPassword").value;
  const h=await hashPassword(entered);
  if(shared && h===shared.passwordHash){
    openReading(shared);
  }else{
    $("unlockPassword").value="";
    $("unlockPassword").placeholder="Wrong password, try again";
  }
};
$("unlockPassword").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();$("unlockButton").click();}
});

/* Parse an incoming shared link (?d=...) on load */
function parseShared(){
  const params=new URLSearchParams(location.search);
  const d=params.get("d");
  if(!d) return null;
  try{
    const data=JSON.parse(dec(d));
    if(data.passwordHash) data.password=true;
    return data;
  }catch(_){
    return null;
  }
}
const shared=parseShared();
</script>
