<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For You 💌</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:Georgia,"Times New Roman",serif;
  color:#633544;
  background:
    radial-gradient(circle at 50% 45%,
      #ffffff 0%,
      #fff9fa 42%,
      #f6e1e6 100%);
}

/* ================= BACKGROUND ================= */

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.glow{
  position:absolute;
  width:380px;
  height:380px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(239,132,159,.22),
    rgba(239,132,159,.08) 38%,
    transparent 72%);
  filter:blur(12px);
  animation:glowMove 13s ease-in-out infinite;
}

.glow.one{left:-150px;top:-140px}
.glow.two{
  right:-160px;
  bottom:-150px;
  animation-delay:-4s;
}
.glow.three{
  width:290px;
  height:290px;
  right:15%;
  top:14%;
  animation-delay:-8s;
}

@keyframes glowMove{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(24px,-18px) scale(1.08)}
}

/* FLOATING SPARKLES */

.spark{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
  opacity:0;

  box-shadow:
    0 0 6px #fff,
    0 0 13px rgba(255,255,255,.98),
    0 0 25px rgba(238,104,140,.85),
    0 0 40px rgba(238,104,140,.38);

  animation:floatSpark var(--duration) infinite ease-in-out;
}

.spark:nth-of-type(4){left:7%;top:80%;--duration:8s}
.spark:nth-of-type(5){left:16%;top:30%;--duration:10s;animation-delay:-2s}
.spark:nth-of-type(6){left:28%;top:85%;--duration:9s;animation-delay:-4s}
.spark:nth-of-type(7){left:40%;top:17%;--duration:11s;animation-delay:-5s}
.spark:nth-of-type(8){left:54%;top:76%;--duration:8s;animation-delay:-1s}
.spark:nth-of-type(9){left:67%;top:24%;--duration:10s;animation-delay:-6s}
.spark:nth-of-type(10){left:81%;top:72%;--duration:9s;animation-delay:-3s}
.spark:nth-of-type(11){left:93%;top:43%;--duration:11s;animation-delay:-7s}
.spark:nth-of-type(12){left:51%;top:47%;--duration:9s;animation-delay:-6s}
.spark:nth-of-type(13){left:12%;top:54%;--duration:10s;animation-delay:-8s}

@keyframes floatSpark{
  0%{
    opacity:0;
    transform:translate(0,45px) scale(.2);
  }
  15%{opacity:.65}
  35%{opacity:1}
  52%{
    opacity:.9;
    transform:translate(15px,-55px) scale(1.15);
  }
  72%{opacity:.5}
  100%{
    opacity:0;
    transform:translate(-8px,-140px) scale(.2);
  }
}

/* FAST OCCASIONAL TWINKLES */

.twinkle{
  position:absolute;
  width:8px;
  height:8px;
  opacity:0;
  transform:scale(.15);

  filter:
    drop-shadow(0 0 5px #fff)
    drop-shadow(0 0 13px rgba(238,104,140,.95));

  animation:twinkle 2s infinite ease-in-out;
}

.twinkle::before,
.twinkle::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  border-radius:999px;
  background:linear-gradient(transparent,#fff 48%,transparent);
}

.twinkle::before{
  width:3px;
  height:29px;
  transform:translate(-50%,-50%);
}

.twinkle::after{
  width:29px;
  height:3px;
  transform:translate(-50%,-50%);
}

.twinkle:nth-child(14){
  left:23%;
  top:22%;
  animation-delay:0s;
}

.twinkle:nth-child(15){
  left:74%;
  top:60%;
  animation-delay:.65s;
}

.twinkle:nth-child(16){
  left:87%;
  top:18%;
  animation-delay:1.3s;
}

@keyframes twinkle{
  0%,55%,100%{
    opacity:0;
    transform:scale(.15) rotate(0);
  }
  65%{
    opacity:.65;
    transform:scale(.7) rotate(20deg);
  }
  72%{
    opacity:1;
    transform:scale(1.25) rotate(45deg);
  }
  80%{
    opacity:.55;
    transform:scale(.8) rotate(65deg);
  }
  88%{
    opacity:0;
    transform:scale(.15) rotate(90deg);
  }
}

/* ================= SCREENS ================= */

.screen{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:opacity .55s ease,visibility .55s ease;

  z-index:5;
}

.screen.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

/* ================= ENVELOPE ================= */

.envelope-stage{
  position:relative;
  width:min(520px,88vw);
  aspect-ratio:1.5/1;
  perspective:1600px;
}

.envelope-stage::after{
  content:"";
  position:absolute;
  left:9%;
  bottom:-12%;
  width:82%;
  height:17%;
  border-radius:50%;
  background:rgba(94,39,57,.22);
  filter:blur(18px);
  z-index:-1;
}

.envelope{
  position:absolute;
  inset:0;
  border-radius:25px;

  transform-style:preserve-3d;

  cursor:pointer;

  background:
    linear-gradient(145deg,
      #f8b8c8,
      #ea91a8 45%,
      #d86d89);

  box-shadow:
    inset 0 2px 5px rgba(255,255,255,.75),
    inset 0 -15px 30px rgba(111,29,53,.12),
    0 26px 60px rgba(101,39,59,.22);
}

.envelope::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:18px;
  z-index:30;
  pointer-events:none;
}

.envelope::after{
  content:"";
  position:absolute;
  inset:17px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  z-index:30;
  pointer-events:none;
}

/* ================= FLAPS ================= */

.front{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:25px;
  z-index:5;
  pointer-events:none;
}

.front::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(34deg,
      transparent 49.65%,
      rgba(255,255,255,.28) 50%,
      transparent 50.35%),
    linear-gradient(-34deg,
      transparent 49.65%,
      rgba(255,255,255,.28) 50%,
      transparent 50.35%);
}

.bottom-flap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:61%;
  z-index:8;

  clip-path:polygon(
    0 0,
    50% 76%,
    100% 0,
    100% 100%,
    0 100%
  );

  background:
    linear-gradient(145deg,#ee94a9,#d96c88);

  border-radius:0 0 25px 25px;
}

.top-flap{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:70%;
  z-index:20;

  clip-path:polygon(
    0 0,
    100% 0,
    50% 100%
  );

  background:
    linear-gradient(145deg,
      #ffd1db,
      #f2a0b3 45%,
      #dd718c);

  transform-origin:top center;
  transform-style:preserve-3d;

  transition:
    transform 1.25s cubic-bezier(.16,1,.3,1);

  filter:drop-shadow(
    0 8px 8px rgba(92,32,51,.20)
  );
}

.envelope.open .top-flap{
  transform:
    rotateX(-178deg);
}

/* ================= SMALL HEART ================= */

.heart-seal{
  position:absolute;
  left:50%;
  top:50%;

  width:16px;
  height:16px;

  transform:
    translate(-50%,-50%)
    rotate(-45deg);

  z-index:50;

  background:
    linear-gradient(145deg,
      #e65376,
      #d53861 60%,
      #b9244d);

  border-radius:3px 0 3px 0;

  box-shadow:
    0 3px 7px rgba(95,25,45,.22);

  transition:
    transform .55s ease,
    opacity .5s ease;
}

.heart-seal::before,
.heart-seal::after{
  content:"";
  position:absolute;
  width:16px;
  height:16px;
  border-radius:50%;
  background:inherit;
}

.heart-seal::before{
  top:-8px;
  left:0;
}

.heart-seal::after{
  top:0;
  left:8px;
}

.envelope.crack .heart-seal{
  animation:sealCrack .42s ease;
}

.envelope.open .heart-seal{
  opacity:0;
  transform:
    translate(-50%,-50%)
    rotate(-45deg)
    scale(.3);
}

@keyframes sealCrack{
  20%{
    transform:
      translate(-50%,-50%)
      rotate(-51deg)
      scale(1.08);
  }
  40%{
    transform:
      translate(-50%,-50%)
      rotate(-39deg)
      scale(.96);
  }
  60%{
    transform:
      translate(-50%,-50%)
      rotate(-48deg);
  }
  100%{
    transform:
      translate(-50%,-50%)
      rotate(-45deg);
  }
}

/* ================= BURST ================= */

.burst{
  position:absolute;
  left:50%;
  top:50%;

  width:5px;
  height:5px;

  border-radius:50%;
  background:#fff;

  box-shadow:
    0 0 9px #fff,
    0 0 19px rgba(223,78,112,.75);

  opacity:0;
  z-index:70;
  pointer-events:none;
}

.envelope.burst .burst{
  animation:sparkleBurst .8s forwards;
}

.burst:nth-of-type(1){--x:-75px;--y:-45px}
.burst:nth-of-type(2){--x:70px;--y:-50px}
.burst:nth-of-type(3){--x:-85px;--y:22px}
.burst:nth-of-type(4){--x:80px;--y:25px}
.burst:nth-of-type(5){--x:-28px;--y:-80px}
.burst:nth-of-type(6){--x:30px;--y:72px}

@keyframes sparkleBurst{
  20%{opacity:1}
  100%{
    opacity:0;
    transform:
      translate(var(--x),var(--y))
      scale(.25);
  }
}

/* ================= HINT ================= */

.open-hint{
  position:fixed;
  bottom:48px;
  color:#c94d70;
  font-size:16px;

  transition:
    opacity .4s,
    transform .4s;
}

.open-hint.hide{
  opacity:0;
  transform:translateY(8px);
}

/* ================= PAPER ================= */

.paper{
  position:relative;

  width:min(820px,94vw);
  height:min(88vh,760px);

  padding:58px 75px 80px;

  background:
    linear-gradient(135deg,
      #fffefa,
      #fff8f6 60%,
      #fff3f1);

  border-radius:11px;

  border:1px solid rgba(190,100,125,.22);

  box-shadow:
    0 35px 80px rgba(80,35,50,.20),
    inset 0 0 40px rgba(190,100,125,.05);

  animation:
    paperArrive
    .9s cubic-bezier(.16,1,.3,1);
}

.paper::before{
  content:"";
  position:absolute;
  inset:13px;
  border:1px solid rgba(190,105,126,.20);
  pointer-events:none;
}

.paper::after{
  content:"";
  position:absolute;
  inset:0;

  pointer-events:none;
  opacity:.11;

  background-image:
    radial-gradient(
      rgba(130,80,90,.18) .5px,
      transparent .7px
    );

  background-size:7px 7px;
  border-radius:11px;
}

@keyframes paperArrive{
  0%{
    opacity:0;
    transform:
      translateY(120px)
      scale(.88)
      rotateX(12deg);
  }
  70%{
    opacity:1;
    transform:
      translateY(-8px)
      scale(1.01)
      rotateX(0);
  }
  100%{
    transform:
      translateY(0)
      scale(1);
  }
}

/* ================= TEXT ================= */

.greeting{
  position:relative;
  z-index:2;

  width:100%;

  border:0;
  outline:0;
  background:transparent;

  text-align:center;

  font:italic 46px Georgia;

  color:#bd4d6d;
}

.greeting::placeholder{
  color:rgba(189,77,109,.30);
}

.divider{
  position:relative;
  z-index:2;
  text-align:center;
  color:#d27189;
  margin:12px 0 24px;
}

.write-note{
  position:relative;
  z-index:2;
  text-align:center;
  font-size:13px;
  color:#a46b7a;
  font-style:italic;
  margin-bottom:14px;
}

#message{
  position:relative;
  z-index:2;

  width:100%;
  height:calc(100% - 190px);

  resize:none;

  border:0;
  outline:0;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 31px,
      rgba(184,111,130,.12) 32px
    );

  font:20px/32px Georgia;
  color:#553641;

  padding:5px 10px;
}

#message::placeholder{
  color:rgba(170,112,126,.48);
  font-style:italic;
}

/* ================= SIGNATURE ================= */

.signature-box{
  position:absolute;
  right:70px;
  bottom:72px;

  width:290px;

  cursor:pointer;
  z-index:10;

  text-align:right;
}

.from-text{
  display:block;
  color:#a94361;
  font:italic 19px Georgia;
  outline:none;
}

.signature-placeholder{
  display:block;
  color:rgba(169,67,97,.30);
  font:italic 17px Georgia;
  margin-top:4px;
}

#signatureImage{
  display:none;

  max-width:235px;
  max-height:75px;

  margin:5px 0 0 auto;
  object-fit:contain;
}

/* ================= BUTTON ================= */

.seal-button{
  position:absolute;
  left:50%;
  bottom:24px;

  transform:translateX(-50%);

  border:0;
  border-radius:999px;

  padding:8px 23px;

  color:#fff;

  background:
    linear-gradient(135deg,#e8849e,#c94e70);

  cursor:pointer;

  box-shadow:
    0 8px 20px rgba(180,65,95,.25);

  transition:
    transform .2s,
    box-shadow .2s;
}

.seal-button:hover{
  transform:
    translateX(-50%)
    translateY(-2px);

  box-shadow:
    0 11px 24px rgba(180,65,95,.32);
}

.close{
  position:absolute;
  right:24px;
  top:18px;

  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:rgba(200,75,110,.10);

  color:#c94d70;

  font-size:24px;

  cursor:pointer;
  z-index:100;
}

/* ================= SIGNATURE SCREEN ================= */

.signature-screen{
  flex-direction:column;

  background:
    radial-gradient(circle at center,
      #fff,
      #fff4f6 60%,
      #f3d8e0);
}

.signature-title{
  font:italic 28px Georgia;
  color:#c4496c;
  margin-bottom:7px;
}

.signature-sub{
  font-size:13px;
  color:#a66a79;
  margin-bottom:18px;
}

#signatureCanvas{
  width:min(850px,92vw);
  height:min(430px,55vh);

  background:rgba(255,255,255,.92);

  border:
    1px solid rgba(190,90,115,.20);

  border-radius:14px;

  box-shadow:
    0 20px 50px rgba(90,35,55,.15);

  touch-action:none;
  cursor:crosshair;
}

.signature-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.signature-action{
  border:0;
  border-radius:999px;

  padding:10px 25px;

  cursor:pointer;
  font-family:Georgia;
}

.clear-signature{
  background:rgba(190,75,105,.10);
  color:#b33f60;
}

.done-signature{
  background:
    linear-gradient(135deg,#e8849e,#c94e70);

  color:#fff;
}

/* ================= SHARE SCREEN ================= */

.share-screen{
  flex-direction:column;
}

.share-envelope{
  position:relative;

  width:min(390px,82vw);
  aspect-ratio:1.5/1;

  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      #f8b5c6,
      #ed7e9b,
      #d45a7a);

  box-shadow:
    0 30px 60px rgba(90,35,55,.25);

  overflow:hidden;
}

.share-envelope::after{
  content:"";
  position:absolute;
  inset:10px;

  border:1px solid rgba(255,255,255,.25);
  border-radius:15px;
}

.share-flap{
  position:absolute;
  inset:0 0 auto;

  height:70%;

  z-index:2;

  clip-path:
    polygon(0 0,100% 0,50% 100%);

  background:
    linear-gradient(
      145deg,
      #ffd0da,
      #f18ca5,
      #d65e7d);
}

.share-heart{
  position:absolute;

  z-index:5;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(-45deg);

  width:15px;
  height:15px;

  background:#d93d65;

  border-radius:3px 0 3px 0;

  box-shadow:
    0 4px 8px rgba(80,20,40,.25);
}

.share-heart::before,
.share-heart::after{
  content:"";
  position:absolute;

  width:15px;
  height:15px;

  background:#d93d65;
  border-radius:50%;
}

.share-heart::before{
  top:-7.5px;
  left:0;
}

.share-heart::after{
  left:7.5px;
  top:0;
}

.share-title{
  font:italic 25px Georgia;
  color:#c4496c;
  margin-top:38px;
}

.share-sub{
  font-size:13px;
  color:#a66a79;
  margin-top:7px;
}

.password-row{
  margin-top:13px;
}

#passwordInput{
  width:250px;

  padding:10px 15px;

  border-radius:999px;

  border:
    1px solid rgba(190,80,110,.20);

  outline:none;

  background:#fff;
  color:#633544;
}

.actions{
  display:flex;
  gap:9px;

  margin-top:17px;

  flex-wrap:wrap;
  justify-content:center;
}

.action{
  border:0;
  border-radius:999px;

  padding:10px 19px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #e8849e,
      #c94e70);

  cursor:pointer;
  font-family:Georgia;
}

#linkBox{
  display:none;
  margin-top:12px;
}

#linkInput{
  width:min(600px,84vw);

  padding:10px;

  border:0;
  border-radius:8px;
  outline:none;
}

/* ================= LOCK SCREEN ================= */

.lock-screen{
  flex-direction:column;
}

.lock-title{
  font:italic 28px Georgia;
  color:#c4496c;
  margin-top:30px;
}

.lock-sub{
  font-size:13px;
  color:#a66a79;
  margin:7px 0 15px;
}

#unlockPassword{
  padding:12px 18px;

  width:250px;

  border-radius:999px;

  border:
    1px solid rgba(190,80,110,.20);

  outline:none;

  text-align:center;
}

.unlock-button{
  margin-top:12px;

  border:0;
  border-radius:999px;

  padding:10px 25px;

  background:#c94e70;
  color:#fff;

  cursor:pointer;
}

.shake{
  animation:shake .35s;
}

@keyframes shake{
  25%{transform:translateX(-7px)}
  50%{transform:translateX(7px)}
  75%{transform:translateX(-5px)}
}

/* ================= READING VIEW ================= */

.reading-paper{
  width:min(800px,94vw);
  height:min(84vh,720px);

  overflow:auto;

  padding:65px 75px;

  background:
    linear-gradient(
      135deg,
      #fffefa,
      #fff8f5,
      #fff3f1);

  border-radius:11px;

  box-shadow:
    0 35px 80px rgba(80,35,50,.20);

  border:
    1px solid rgba(190,100,125,.20);

  animation:
    readingAppear
    .8s cubic-bezier(.16,1,.3,1);
}

@keyframes readingAppear{
  from{
    opacity:0;
    transform:
      translateY(30px)
      scale(.97);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}

.reading-paper::-webkit-scrollbar{
  width:6px;
}

.reading-paper::-webkit-scrollbar-thumb{
  background:rgba(190,80,110,.22);
  border-radius:20px;
}

.read-greeting{
  text-align:center;
  font:italic 46px Georgia;
  color:#bd4d6d;
}

.read-divider{
  text-align:center;
  color:#d27189;
  margin:15px 0 35px;
}

#readMessage{
  white-space:pre-wrap;
  font:21px/2 Georgia;
  color:#553641;
}

#readSignature{
  margin-top:40px;
  text-align:right;
}

#readSignature img{
  max-width:240px;
  max-height:90px;

  object-fit:contain;

  display:block;
  margin-left:auto;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .glow{
    width:240px;
    height:240px;
  }

  .envelope-stage{
    width:88vw;
  }

  .envelope{
    border-radius:19px;
  }

  .open-hint{
    bottom:34px;
    font-size:13px;
  }

  .paper{
    width:94vw;
    height:88vh;
    padding:48px 28px 80px;
  }

  .greeting,
  .read-greeting{
    font-size:34px;
  }

  #message{
    font-size:17px;
    line-height:29px;
  }

  .signature-box{
    right:28px;
    bottom:68px;
  }

  .share-title{
    font-size:22px;
  }

  .reading-paper{
    width:94vw;
    padding:55px 30px;
  }

  #readMessage{
